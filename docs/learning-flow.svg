<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">RobotLearnLab evidence-to-action lesson</title><desc id="desc">Conceptual learning flow, not a live sensor display. Observe pose and a frozen snapshot, classify pitch, set the robot_state blackboard key, choose the matching motion, and verify a fresh reading in the standing band from minus 20 to plus 20 degrees.</desc><rect width="1200" height="430" rx="24" fill="#f7f3ee"/><g font-family="Arial, sans-serif"><text x="44" y="48" fill="#96724b" font-size="14" font-weight="700" letter-spacing="3">ROBOTLEARNLAB / LEARN THE REASONING, NOT JUST THE MOTION</text><text x="44" y="99" fill="#3e352b" font-size="34" font-weight="700">Evidence → interpretation → action → fresh evidence</text><text x="44" y="132" fill="#7e7163" font-size="17">CTAT evaluates the lesson. The optional AI sidebar explains it.</text><rect x="44" y="179" width="208" height="133" rx="14" fill="#fff" stroke="#dfd4c6"/><text x="60" y="209" fill="#ad7d45" font-size="14" font-weight="700">01</text><text x="60" y="252" fill="#3e352b" font-size="23" font-weight="700">Observe</text><text x="60" y="279" fill="#7e7163" font-size="12">Pose + one frozen snapshot</text><rect x="270" y="179" width="208" height="133" rx="14" fill="#fff" stroke="#dfd4c6"/><text x="286" y="209" fill="#ad7d45" font-size="14" font-weight="700">02</text><text x="286" y="252" fill="#3e352b" font-size="23" font-weight="700">Interpret</text><text x="286" y="279" fill="#7e7163" font-size="12">Y-axis pitch → robot state</text><rect x="496" y="179" width="208" height="133" rx="14" fill="#fff" stroke="#dfd4c6"/><text x="512" y="209" fill="#ad7d45" font-size="14" font-weight="700">03</text><text x="512" y="252" fill="#3e352b" font-size="23" font-weight="700">Represent</text><text x="512" y="279" fill="#7e7163" font-size="12">Write the robot_state key</text><rect x="722" y="179" width="208" height="133" rx="14" fill="#fff" stroke="#dfd4c6"/><text x="738" y="209" fill="#ad7d45" font-size="14" font-weight="700">04</text><text x="738" y="252" fill="#3e352b" font-size="23" font-weight="700">Choose</text><text x="738" y="279" fill="#7e7163" font-size="12">Match a recovery motion</text><rect x="948" y="179" width="208" height="133" rx="14" fill="#fff" stroke="#dfd4c6"/><text x="964" y="209" fill="#ad7d45" font-size="14" font-weight="700">05</text><text x="964" y="252" fill="#3e352b" font-size="23" font-weight="700">Verify</text><text x="964" y="279" fill="#7e7163" font-size="12">Re-read the standing band</text><rect x="44" y="338" width="1112" height="44" rx="12" fill="#e8dfd2"/><text x="600" y="366" text-anchor="middle" fill="#665540" font-size="16">Lesson standing band: −20° ≤ Y ≤ 20°  /  Recheck the state; do not require the original value.</text><text x="44" y="411" fill="#968674" font-size="12">CONCEPTUAL LESSON FLOW · NOT A UNIVERSAL ROBOT SAFETY POLICY OR LIVE SENSOR DISPLAY</text></g></svg>